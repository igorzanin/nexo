name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg2://nexo:nexo@localhost:5432/nexo_test
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://nexo:nexo@localhost:5432/nexo_test
          SECRET_KEY: ci-secret-key
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check + build
        run: npm run build
      - name: Run tests
        run: npm run test
